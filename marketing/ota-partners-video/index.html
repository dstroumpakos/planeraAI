<html lang="el">

<meta charset="utf-8">
<title>Planera OTA Partners Film</title>
<link rel="stylesheet" href="assets/tw.out.css">

  @font-face { font-family: Inter; font-weight: 500 650; src: url(assets/Inter-SemiBold.ttf); }
  @font-face { font-family: Inter; font-weight: 700 900; src: url(assets/Inter-ExtraBold.ttf); }

  svg.lu { display: inline-block; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  #win { position: relative; width: 960px; border-radius: 18px; overflow: hidden; background: #0a0a0a; box-shadow: 0 40px 120px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08); }

  #url { margin-left: 18px; flex: 1; height: 28px; border-radius: 8px; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); font-size: 13px; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  #vp { position: relative; width: 960px; height: 1560px; overflow: hidden; }
  #spot { position: absolute; left: 0; top: 0; border-radius: 16px; box-shadow: 0 0 0 4000px rgba(4,5,8,0.62), 0 0 0 2px rgba(255,229,0,0.6); z-index: 40; pointer-events: none; }

  .inp { margin-top: 4px; width: 100%; border-radius: 8px; border: 1px solid #404040; background: #0a0a0a; padding: 8px 12px; font-size: 14px; color: #fff; min-height: 38px; }

  .caret { display: inline-block; width: 2px; height: 16px; background: #FFE500; vertical-align: -3px; margin-left: 1px; }
  #picker { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; }

  .phone { position: absolute; width: 560px; height: 1176px; border-radius: 82px; background: #0B0B0F; padding: 16px; box-shadow: 0 50px 120px rgba(0,0,0,0.6), inset 0 0 0 2px #2A2A33; z-index: 30; will-change: transform; }
  .scr { position: relative; width: 528px; height: 1144px; border-radius: 68px; overflow: hidden; background: #FAF9F6; }
  .island { position: absolute; top: 14px; left: 50%; width: 150px; height: 42px; margin-left: -75px; border-radius: 21px; background: #000; z-index: 50; }
  .app { position: absolute; left: 0; top: 0; width: 400px; height: 867px; transform: scale(1.32); transform-origin: 0 0; color: #1A1A1A; overflow: hidden; }
  .app .sb { position: absolute; left: 0; right: 0; top: 0; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 8px 32px 0 36px; font-weight: 600; font-size: 15px; z-index: 30; background: rgba(250,249,246,0.96); }
  .app .scroll { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
  .app .sec { margin-bottom: 24px; }
  .app .hd { padding: 0 20px; margin-bottom: 14px; }
  .app .hd b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .app .hd span { display: block; font-size: 13px; font-weight: 600; color: #9B9B9B; margin-top: 2px; }
  .app .row { display: flex; gap: 16px; padding: 0 20px; will-change: transform; }
  .app .card { position: relative; flex: none; width: 260px; height: 300px; border-radius: 24px; overflow: hidden; background: #2C2C2E; }
  .app .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .app .card .g { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.25) 45%, rgba(0,0,0,0.85) 100%); }
  .app .pill { position: absolute; top: 14px; left: 14px; display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.92); padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
  .app .body { position: absolute; left: 16px; right: 16px; bottom: 16px; }
  .app .ag { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 13px; font-weight: 800; color: #FFE500; letter-spacing: 0.2px; }
  .app .ct { font-size: 19px; font-weight: 800; color: #fff; letter-spacing: -0.3px; line-height: 24px; }
  .app .cf { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 10px; }
  .app .pl { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85); }
  .app .pr { display: flex; align-items: baseline; gap: 4px; background: #FFE500; padding: 6px 12px; border-radius: 999px; }
  .app .pr small { font-size: 11px; font-weight: 600; color: rgba(0,0,0,0.65); }
  .app .pr b { font-size: 16px; font-weight: 800; color: #000; }
  .app .radar { margin: 0 20px 26px; border: 2px solid #FFE500; border-radius: 22px; background: #fff; height: 120px; padding: 16px; }
  .app .tbar { position: absolute; left: 14px; right: 14px; bottom: 26px; height: 64px; border-radius: 32px; background: #2C2C2E; display: flex; align-items: center; justify-content: space-around; z-index: 30; }
  .app .tbar .plus { width: 62px; height: 62px; border-radius: 31px; background: #FFE500; border: 4px solid #1A1A1A; display: flex; align-items: center; justify-content: center; margin-top: -14px; box-shadow: 0 0 0 8px rgba(255,229,0,0.18); }
  .app .tbar .home { width: 58px; height: 44px; border-radius: 16px; background: rgba(255,229,0,0.15); display: flex; align-items: center; justify-content: center; }
  .app .bd { position: absolute; inset: 0; background: rgba(0,0,0,0.45); z-index: 40; }
  .app .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 28px 28px 0 0; overflow: hidden; z-index: 41; padding-bottom: 34px; will-change: transform; }
  .app .sheet .im { position: relative; height: 200px; background: #2C2C2E; }
  .app .sheet .im img { width: 100%; height: 100%; object-fit: cover; }
  .app .sheet .x { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 17px; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; }
  .app .sheet .c { padding: 20px; }
  .app .sheet .sa { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; color: #6B6B6B; }
  .app .sheet h3 { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; margin-top: 2px; }
  .app .sheet .meta { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .app .sheet .meta span { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: #9B9B9B; }
  .app .sheet .meta b { font-size: 18px; font-weight: 800; }
  .app .sheet p { font-size: 15px; line-height: 22px; color: #6B6B6B; margin-top: 14px; }
  .app .cta { margin: 4px 20px 0; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px 0; border-radius: 16px; background: #FFE500; font-size: 16px; font-weight: 800; color: #000; will-change: transform; }
  .app .disc { font-size: 12px; text-align: center; margin-top: 10px; color: #9B9B9B; padding: 0 20px; }
  /* the OTA's own site, after the tap */
  .app .site { position: absolute; inset: 0; background: #fff; z-index: 45; }
  .app .site .hero { height: 260px; position: relative; }
  .app .site .hero img { width: 100%; height: 100%; object-fit: cover; }
  .app .site .bar { position: absolute; left: 12px; right: 12px; bottom: 30px; height: 46px; border-radius: 23px; background: rgba(240,240,242,0.96); box-shadow: 0 6px 20px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; color: #1A1A1A; z-index: 3; }
  .sk { background: #ECEAE4; border-radius: 8px; }

  /* captions (LinkedIn autoplays muted) */
  .cap { position: absolute; left: 0; right: 0; display: flex; justify-content: center; z-index: 80; pointer-events: none; }
  .cap span { display: inline-block; max-width: 980px; background: rgba(10,10,10,0.92); color: #fff; border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; padding: 22px 34px 24px; font-weight: 800; font-size: 50px; letter-spacing: -0.025em; line-height: 1.12; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,0.45); will-change: transform; }
  .cap b { color: #FFE500; font-weight: 800; }
  #ptr { position: absolute; left: 0; top: 0; z-index: 60; pointer-events: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5)); }
  #tap { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 42px; background: rgba(30,30,30,0.25); border: 4px solid rgba(255,255,255,0.9); z-index: 61; }

  /* end card */
  #end { position: absolute; inset: 0; z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse 70% 45% at 50% 0%, rgba(255,229,0,0.12), transparent 70%), #0a0a0a; }
  #endLogo { position: relative; width: 760px; height: 210px; }
  #mark { position: absolute; left: 0; top: 0; width: 140px; height: 210px; transform-origin: 50% 60%; z-index: 2; }
  #wmMask { position: absolute; left: 151px; top: 0; width: 609px; height: 210px; overflow: hidden; }
  #wm { width: 609px; height: 210px; display: block; }
  #endEyebrow { margin-top: 26px; font-weight: 800; font-size: 30px; letter-spacing: 0.24em; color: #FFE500; }
  #endLine1 { margin-top: 30px; font-weight: 800; font-size: 64px; letter-spacing: -0.035em; color: #fff; text-align: center; line-height: 1.08; }
  #endLine2 { margin-top: 22px; font-weight: 600; font-size: 36px; color: rgba(255,255,255,0.6); text-align: center; line-height: 1.35; }
  #endUrl { margin-top: 60px; background: #FFE500; color: #0a0a0a; border-radius: 999px; padding: 22px 44px; font-weight: 800; font-size: 44px; box-shadow: 0 14px 40px rgba(255,229,0,0.25); }
</style>
</head>
<body>
<div id="stage">
  <div id="cam">
    <div id="win">
      <div id="chrome"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><div id="url"><span id="lockI"></span>planeraai.app/partners/products</div></div>
      <div id="vp"><div id="dash"></div></div>

    <div id="endUrl">planeraai.app/partners</div>

</div>

<script src="assets/icons.js"></script>

<script>
const DURATION = 29.5;
const FPS = 30;
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (p) => 1 - Math.pow(1 - p, 3);
const inCubic = (p) => p * p * p;
const inOutCubic = (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const outBack = (p, s = 1.7) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
function show(el, v) { el.style.opacity = v; el.style.visibility = v <= 0.001 ? "hidden" : "visible"; }
const ic = (name, size = 16, cls = "") => `<svg class="lu ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24">${LUCIDE[name]}</svg>`;
$("lockI").innerHTML = ic("lock", 13);
// Ionicons-style glyphs for the mobile app
const io = {
  storefront: (c, s = 13) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0zM5 12v8h5v-5h4v5h5v-8" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/></svg>`,
  location: (c, s = 13) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 22s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z" fill="${c}"/><circle cx="12" cy="10" r="2.6" fill="#fff" fill-opacity=".85"/></svg>`,
  bus: (s = 12) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="15" rx="3" fill="#1A1A1A"/><rect x="6" y="6" width="12" height="6" rx="1" fill="#fff"/><circle cx="8" cy="15" r="1.3" fill="#fff"/><circle cx="16" cy="15" r="1.3" fill="#fff"/><path d="M7 18v3M17 18v3" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  open: (s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,

  globe: `<svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#8E8E93" stroke-width="1.8"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="#8E8E93" stroke-width="1.6"/></svg>`,

/* ===================== the partner dashboard ===================== */
const AGENCY = "Your Agency";
const NEW = { title: "Μετέωρα & Ζαγοροχώρια · 3 ημέρες", desc: "Μονές των Μετεώρων, πέτρινα γεφύρια και φαράγγι του Βίκου. Με ξενοδοχείο και πρωινό.", dest: "Μετέωρα, Ελλάδα", price: "189", url: "https://youragency.gr/meteora" };

const label = (txt, inner, extra = "") => `<label class="block text-xs font-medium text-neutral-400 ${extra}">${txt}${inner}</label>`;
$("dash").innerHTML = `
<div class="min-h-screen bg-neutral-950 text-white" style="min-height:1560px">
  <div class="mx-auto max-w-3xl px-5 py-8">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3"><img src="assets/logo.png" alt="" style="height:24px;width:auto"><div><div class="text-sm font-semibold leading-tight">${AGENCY}</div><div class="text-xs text-neutral-500">Προϊόντα συνεργάτη</div></div></div>

      <h1 class="text-xl font-bold">Τα προϊόντα σας</h1>
      <div class="flex flex-wrap gap-2" id="topBtns">
        <span id="csvBtn" class="inline-flex items-center gap-1.5 rounded-lg border border-neutral-700 px-3.5 py-2 text-sm font-medium text-neutral-200">${ic("upload", 16)} Εισαγωγή CSV</span>
        <span id="addBtn" class="inline-flex items-center gap-1.5 rounded-lg bg-[#FFE500] px-3.5 py-2 text-sm font-semibold text-neutral-950">${ic("plus", 16)} Προσθήκη προϊόντος</span>
      </div>
    </div>
    <p class="mt-1 text-sm text-neutral-500">Οι νέες και επεξεργασμένες καταχωρίσεις ελέγχονται από την ομάδα μας πριν δημοσιευτούν.</p>

      <h2 class="text-base font-semibold">Νέο προϊόν</h2>
      <div class="mt-4 grid grid-cols-2 gap-4">
        ${label("Τύπος", `<div class="inp flex items-center justify-between"><span>Εκδρομή</span><span class="text-neutral-500">▾</span></div><span class="mt-1 block text-[11px] font-normal text-neutral-500">Οι πτήσεις προστίθενται μόνο μέσω Εισαγωγής / API.</span>`)}

  show($("cam"), clamp(winOn));
  const sp = spotAt(t);
  if (sp && sp.o > 0.001) { const st = $("spot").style; st.transform = `translate(${sp.x}px, ${sp.y}px)`; st.width = sp.w + "px"; st.height = sp.h + "px"; show($("spot"), sp.o); } else show($("spot"), 0);

  /* ----- the traveller's phone ----- */
  const p1 = outCubic(prog(t, B.phoneIn, B.phoneIn + 0.8)) * (1 - inCubic(prog(t, B.toDash[0], B.toDash[1])));
  const p2 = outCubic(prog(t, B.toPhone[0], B.toPhone[1] + 0.2)) * (1 - inCubic(prog(t, B.toDash2[0], B.toDash2[1])));
  const ph = t < B.toPhone[0] ? p1 : p2;
  const drift = 1 + 0.03 * (t < B.toDash[0] ? prog(t, 1, B.toDash[0]) : prog(t, B.toPhone[1], B.toDash2[0]));
  $("phone").style.left = "260px"; $("phone").style.top = "70px";
  $("phone").style.transform = `translateY(${(1 - ph) * 1400}px) scale(${drift})`;
  show($("phone"), ph > 0.001 ? 1 : 0);
  // home scroll to the partner row
  const sec = $("partnerSec");
  const scrollTo = sec.offsetTop - 90;
  $("hs").style.transform = `translateY(${-scrollTo * inOutCubic(prog(t, B.homeScroll[0], B.homeScroll[1])) - (t > B.toPhone[0] ? scrollTo * 0 : 0)}px)`;
  if (t > B.toPhone[0]) $("hs").style.transform = `translateY(${-scrollTo}px)`;
  // before approval the row starts with the other cards; after, the new Meteora card slides in first
  const newIn = t > B.toPhone[0] ? outCubic(prog(t, B.rowSlide[0], B.rowSlide[1])) : 0;
  $("card-meteora").style.display = t > B.toPhone[0] ? "block" : "none";
  $("row").style.transform = t > B.toPhone[0] ? `translateX(${(1 - newIn) * -276}px)` : "none";
  $("card-meteora").style.boxShadow = newIn > 0 ? `0 0 0 ${3 * Math.exp(-Math.max(0, t - B.rowSlide[1]) * 1.5)}px #FFE500` : "";
  // hook: highlight the agency name on the first card
  const hlP = t < B.toDash[0] ? outBack(prog(t, B.hl, B.hl + 0.4), 2) : 0;
  document.querySelectorAll("#row .agName").forEach((n, i) => { n.style.background = i === 1 && hlP > 0 ? `rgba(255,229,0,${0.22 * clamp(hlP)})` : ""; n.style.borderRadius = "6px"; n.style.padding = "1px 5px"; n.style.outline = i === 1 && hlP > 0 ? "2px solid #FFE500" : ""; });
  $("card-nafplio").style.transform = t < B.toDash[0] ? `scale(${1 + 0.04 * clamp(hlP)})` : "";
  // detail sheet
  const sh = outCubic(prog(t, B.sheetIn[0], B.sheetIn[1]));
  $("bd").style.display = $("sheet").style.display = sh > 0 && t < B.siteIn[1] ? "block" : "none";
  $("bd").style.opacity = sh; $("sheet").style.transform = `translateY(${(1 - sh) * 100}%)`;
  $("cta").style.transform = `scale(${1 - 0.05 * Math.sin(prog(t, B.tapCta, B.tapCta + 0.2) * Math.PI)})`;
  const si = outCubic(prog(t, B.siteIn[0], B.siteIn[1]));
  $("site").style.display = si > 0 ? "block" : "none"; $("site").style.transform = `translateX(${(1 - si) * 100}%)`;

  /* ----- pointer on the dashboard, finger on the phone ----- */
  const CL = [[B.tapAdd, $("addBtn")], [B.tapUns, $("unsBtn")], [B.tapPhoto, document.querySelector("#grid .pk")], [B.tapUse, $("useBtn")], [B.tapAllGr, $("allGr")], [B.tapSubmit, $("submitBtn")]];
  let px = null, py = null, pressed = false;
  for (const [atT, el] of CL) {
    if (t > atT - 0.45 && t < atT + 0.3 && el.offsetWidth) {
      const [cx, cy] = centre(el); const sx = 540 - cam[0] * cam[2] + (cx + 8) * cam[2], sy = 675 - cam[1] * cam[2] + (cy + 6) * cam[2];
      const p = inOutCubic(prog(t, atT - 0.45, atT - 0.04)); px = lerp(sx + 160, sx, p); py = lerp(sy + 120, sy, p); pressed = t > atT - 0.02 && t < atT + 0.12;
    }
  }
  if (px !== null) { $("ptr").style.transform = `translate(${px}px, ${py}px) scale(${pressed ? 0.85 : 1})`; show($("ptr"), 1); } else show($("ptr"), 0);
  const TP = [[B.tapCard, () => $("card-meteora")], [B.tapCta, () => $("cta")]];
  let tapped = false;
  for (const [atT, get] of TP) if (t > atT - 0.18 && t < atT + 0.3) { const r = get().getBoundingClientRect(); $("tap").style.left = (r.left + r.width / 2) + "px"; $("tap").style.top = (r.top + r.height / 2) + "px"; show($("tap"), Math.sin(prog(t, atT - 0.18, atT + 0.3) * Math.PI)); tapped = true; }
  if (!tapped) show($("tap"), 0);

  /* ----- captions ----- */
  let cap = null; for (const c of CAPS) if (t > c[0] && t < c[1] + 0.25) cap = c;
  if (cap) {
    $("capText").innerHTML = cap[2];
    const ci = outBack(prog(t, cap[0], cap[0] + 0.4), 1.8), co = inCubic(prog(t, cap[1], cap[1] + 0.25));
    $("capText").style.transform = `translateY(${(1 - ci) * 40}px) scale(${lerp(0.85, 1, ci)})`;
    show($("cap"), clamp(prog(t, cap[0], cap[0] + 0.12)) * (1 - co)); $("cap").style.top = cap[3] + "px";
  } else show($("cap"), 0);

  /* ----- end card ----- */
  show($("end"), inOutCubic(prog(t, B.end[0], B.end[1])));
  const mInP = prog(t, B.logo, B.logo + 0.7), slide = inOutCubic(prog(t, B.slide, B.slide + 0.7)), markX = lerp(310, 0, slide);
  $("mark").style.transform = `translateX(${markX}px) scale(${Math.max(0.0001, outBack(mInP, 2.4) * lerp(1.3, 1, slide))}) rotate(${(1 - outCubic(mInP)) * -140}deg)`;
  $("wm").style.transform = `translateX(${lerp(-105, 0, slide)}%)`;
  $("wmMask").style.clipPath = `inset(0 0 0 ${markX}px)`;
  [["endEyebrow", B.slide + 0.3], ["endLine1", B.line1], ["endLine2", B.line2], ["endUrl", B.url]].forEach(([id, s]) => { const p = outCubic(prog(t, s, s + 0.5)); $(id).style.opacity = p; $(id).style.transform = `translateY(${(1 - p) * 30}px)`; });
}

// the film plays the story clock back at per-section speeds (timemap.js)
const renderStory = render; // keep the story renderer: reassigning window.render rebinds the global name
window.render = (vt) => renderStory(TIMEMAP.videoToStory(vt));
window.DURATION = TIMEMAP.VIDEO_END;
window.FPS = FPS;
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))));
const q = new URLSearchParams(location.search);
window.ready.then(() => {
  if (q.has("t")) window.render(parseFloat(q.get("t")));
  else if (!navigator.webdriver) { const t0 = performance.now(); const loop = () => { window.render(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); }; loop(); }
});
</script>
</body>
</html>
